[project]
name = "agentknowledgevault"
version = "0.1.0"
description = "A standard Python project managed by uv and Nix"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "jsonschema>=4.23.0",
  "mypy>=1.9.0",
  "pytest>=8.0.0",
  "ruff>=0.3.0",
  "types-jsonschema>=4.23.0",
]

[tool.mypy]
exclude = [".direnv", ".venv"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentknowledgevault"]
